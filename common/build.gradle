plugins {
    id 'java-library'
    id 'dev.architectury.loom'
}

def mcVer = stonecutter.node.metadata.version

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

java {
    if (stonecutter.eval(mcVer, "<1.20.5")) {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    } else if (stonecutter.eval(mcVer, "<26.0")) {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    } else {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    def mcDepVer = stonecutter.eval(mcVer, ">=26.0") ? project.property('minecraft_version_26_1') : mcVer
    minecraft "com.mojang:minecraft:${mcDepVer}"
    if (stonecutter.eval(mcVer, "<26.0")) {
        mappings loom.officialMojangMappings()
    } else {
        mappings files("${rootDir}/empty-mappings.jar")
    }

    if (stonecutter.eval(mcVer, "<1.20.5")) {
        compileOnly "maven.modrinth:open-parties-and-claims:${project.property('opc_version_1_20_1_forge')}"
        modCompileOnly "maven.modrinth:forge-config-api-port:v${project.property('forge_config_api_port_fabric_version_1_20_1')}-1.20.1-Fabric"
    } else if (stonecutter.eval(mcVer, "<26.0")) {
        compileOnly "maven.modrinth:open-parties-and-claims:${project.property('opc_version')}"
        compileOnly "net.neoforged:neoforge:${project.property('neo_version')}"
        compileOnly 'net.neoforged.fancymodloader:loader:4.0.42'
    } else {
        compileOnly "maven.modrinth:open-parties-and-claims:${project.property('opc_version_26_1_neoforge')}"
        compileOnly "net.neoforged:neoforge:${project.property('neo_version_26_1')}"
        compileOnly 'net.neoforged.fancymodloader:loader:11.0.15'
    }

    compileOnly 'net.fabricmc:fabric-loader:0.16.14'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    if (stonecutter.eval(mcVer, "<1.20.5")) {
        compileOnly files("${rootDir}/libs/xaeroworldmap-forge-1.20.1-1.47.0.jar")
    } else {
        compileOnly files("${rootDir}/libs/xaeroworldmap-neoforge-1.21.1-1.41.2.jar")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (stonecutter.eval(mcVer, ">=1.20.5")) {
        testImplementation "net.neoforged:neoforge:${project.property('neo_version')}"
        testImplementation 'net.neoforged.fancymodloader:loader:4.0.42'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

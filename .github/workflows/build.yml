name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon :opac-warfare:jar :opac-better-protection:jar test
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: |
            opac-warfare/build/libs/opac-warfare-*.jar
            opac-better-protection/build/libs/opac-better-protection-*.jar

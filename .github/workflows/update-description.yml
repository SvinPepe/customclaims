name: Update Modrinth Description

on:
  push:
    branches: [ "main" ]
    paths:
      - 'DESCRIPTION.md'
  workflow_dispatch:

jobs:
  update-description:
    name: Sync Modrinth Description
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update Modrinth Project Body
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || secrets.MODRINTH_API_KEY }}
        run: |
          python .github/scripts/update_modrinth_description.py

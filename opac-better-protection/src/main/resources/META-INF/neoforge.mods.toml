modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SvinPepe/customclaims/issues"
showAsResourcePack=false

[[jarJar]]
identifier { group = "dev.customclaims", artifact = "customclaims-core" }
version { range = "[${mod_version},)", artifactVersion = "${mod_version}" }

[[mixins]]
config="customclaims_create.mixins.json"

[[mixins]]
config="customclaims_aeronautics.mixins.json"

[[mixins]]
config="customclaims_big_cannons.mixins.json"

[[mods]]
modId="opac_better_protection"
version="${mod_version}"
displayName="Open Parties and Claims: Better Protection"
displayURL="https://github.com/SvinPepe/customclaims"
authors="${mod_authors}"
credits="Built for NeoForge servers that use Open Parties and Claims for claim rules and technical mod protections."
description='''
Open Parties and Claims: Better Protection 2.0 - direct OPAC explosion sync, /claimrules GUI, Create contraption and Deployer machine protection, CBC cannon launch protection, and Aeronautics bore hooks.
'''

[[dependencies.opac_better_protection]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.opac_better_protection]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.opac_better_protection]]
modId="openpartiesandclaims"
type="required"
versionRange="[0.27.5,)"
ordering="AFTER"
side="BOTH"

[[dependencies.opac_better_protection]]
modId="customclaims_core"
type="required"
versionRange="[${mod_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.opac_better_protection]]
modId="opac_warfare"
type="optional"
versionRange="[${mod_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.opac_better_protection]]
modId="create"
type="optional"
versionRange="[6.0.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies.opac_better_protection]]
modId="createbigcannons"
type="optional"
versionRange="[5.11.7,)"
ordering="AFTER"
side="BOTH"

[[dependencies.opac_better_protection]]
modId="aeronautics"
type="optional"
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

plugins {
    id 'java-library'
    id 'dev.architectury.loom'
}

def mcVer = stonecutter.node.metadata.version

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

loom {
    forge {
    }
}

def commonProject = stonecutter.node.sibling('common').project

dependencies {
    minecraft "com.mojang:minecraft:${mcVer}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:1.20.1-${project.property('forge_version_1_20_1')}"

    compileOnly "maven.modrinth:open-parties-and-claims:${project.property('opc_version_1_20_1_forge')}"
    compileOnly files("${rootDir}/libs/xaeroworldmap-forge-1.20.1-1.47.0.jar")

    compileOnly commonProject
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    source(commonProject.sourceSets.main.allSource)
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(commonProject.sourceSets.main.resources)
}

base {
    archivesName = "opac-warfare-${mcVer}-forge"
}

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'opac-warfare'

include 'customclaims-core'
include 'customclaims-war'
include 'customclaims-xaero'
include 'opac-warfare'
